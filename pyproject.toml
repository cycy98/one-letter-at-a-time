[project]
name = "word-game-engine"
version = "2.0.0"
description = "Turn-based word games for Discord"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["discord.py>=2.4"]

[dependency-groups]
dev = ["mypy>=1.15", "ruff>=0.11"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "LOG", "RUF", "TID"]
ignore = ["S311"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time".msg = "the kernel is clockless"
"asyncio".msg = "the kernel is clockless"
"discord".msg = "the kernel is platform-free"
"sqlite3".msg = "the kernel is storage-free"
"pathlib".msg = "the kernel performs no I/O"

[tool.ruff.lint.per-file-ignores]
"bot.py" = ["TID251"]
"lexicon.py" = ["TID251"]
"ledger.py" = ["TID251"]
"tests/*" = ["TID251", "S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["kernel", "bot.py", "lexicon.py", "ledger.py", "tests"]
